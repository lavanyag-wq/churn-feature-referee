[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-feature-referee"
version = "0.1.0"
description = "A training/serving feature parity referee: a third implementation compiled from the feature spec that says which side computed it wrong"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lavanya Gurrapu", email = "lavanya.g@mycvcareer.com"}]
dependencies = ["deltalake>=0.18", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
feature-referee = "churn_feature_referee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
