name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools experiments

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests as their own step
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=churn_feature_referee
          --cov-report=json:reports/coverage.json
          --cov-report=xml:reports/coverage.xml
      - name: Coverage floor
        run: |
          python - << 'PY'
          import json
          pct = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          floor = 95.0
          print(f"line coverage {pct:.1f}% (floor {floor}%)")
          raise SystemExit(0 if pct >= floor else 1)
          PY

  receipts:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (machine-readable reports for the collector)
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=churn_feature_referee
          --cov-report=json:reports/coverage.json
      - name: Re-run every experiment from scratch
        run: make experiments
      - name: Collect metrics from the reports just produced
        run: python tools/collect_metrics.py --skip-tests --skip-experiments
      - name: Fail on any stale published number
        run: python tools/check_numbers.py
      - name: Regenerate the diagram and fail if it drifted from the committed SVG
        run: |
          python tools/render_diagram.py
          git diff --exit-code docs/diagram.svg
      - name: Publish the awkward table to the job summary
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          a = json.load(open("docs/experiments/attribution.json"))
          print("### What each instrument sees (parity vs referee)")
          print("")
          print("| scenario | parity sees | actually wrong | divergent |")
          print("| --- | ---: | ---: | ---: |")
          for r in a["rows"]:
              print(f"| {r['scenario']} | {r['parity_mismatches']} | "
                    f"{r['wrong_pairs']} | {r['divergent']} |")
          b = json.load(open("docs/experiments/blindspot.json"))
          h = b["rows"][0]
          print("")
          print(f"shared-bug blind spot: parity {h['parity_mismatches']}, "
                f"referee {h['agree_wrong']} wrong pairs "
                f"({h['wrong_share_pct']}% of the table)")
          PY
      - name: Upload experiment JSON and reports
        uses: actions/upload-artifact@v4
        with:
          name: experiments-and-reports
          path: |
            docs/experiments/
            docs/metrics.json
            reports/
